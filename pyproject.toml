[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbp-backend"
version = "0.1.0"
description = "The Beauty Project — programmatic beauty & skincare publisher backend"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Database — async SQLAlchemy 2.0 + asyncpg driver + pgvector
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",

    # Migrations
    "alembic>=1.13.1",

    # Config / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # Async task queue
    "celery>=5.4.0",
    "redis>=5.0.4",
    "celery[redis]>=5.4.0",

    # HTTP client (affiliate / GSC calls)
    "httpx>=0.27.0",

    # Utilities
    "orjson>=3.10.3",
    "tenacity>=8.3.0",

    # Fuzzy string matching — ingredient normalizer (difflib is stdlib fallback)
    "rapidfuzz>=3.9.0",

    # Numerical — formula vector math for dupe engine
    "numpy>=1.26.0",
]

[project.optional-dependencies]
ml = [
    # Sentence embeddings for Tier-3 entity resolution & name_vector generation
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
