services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tbp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tbp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbp} -d ${POSTGRES_DB:-tbp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Redis — Celery broker + result backend + cache
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tbp_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # FastAPI application
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tbp_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ──────────────────────────────────────────────
  # Celery worker
  # ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tbp_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4

volumes:
  postgres_data:
  redis_data:
